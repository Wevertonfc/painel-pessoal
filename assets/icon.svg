<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with subtle dark gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Rings representing personal target/hub -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.15" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.3" filter="url(#glow)" />
  
  <!-- Center Target Emblem -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="url(#neonGrad)" stroke-width="16" filter="url(#glow)" />
  
  <!-- Target lines -->
  <line x1="256" y1="120" x2="256" y2="150" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <line x1="256" y1="362" x2="256" y2="392" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <line x1="120" y1="256" x2="150" y2="256" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <line x1="362" y1="256" x2="392" y2="256" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center bullseye core -->
  <circle cx="256" cy="256" r="28" fill="url(#neonGrad)" filter="url(#glow)" />
</svg>
